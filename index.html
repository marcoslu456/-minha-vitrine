<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Loja de Ofertas | Achadinhos ML</title>
    <!-- Google Fonts: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'ml-yellow': '#FFE600',
                        'ml-dark-blue': '#2D3277',
                        'ml-blue': '#3483FA',
                        'ml-bg': '#F5F6FA',
                    },
                    fontFamily: {
                        poppins: ['Poppins', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Poppins', sans-serif; }
        .curved-header {
            border-bottom-left-radius: 40px;
            border-bottom-right-radius: 40px;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .product-card { transition: all 0.3s ease; }
        .product-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="bg-ml-bg text-gray-800 min-h-screen flex flex-col">

    <!-- 1. Cabeçalho -->
    <header class="bg-ml-yellow py-8 px-4 curved-header shadow-sm text-center">
        <h1 class="text-3xl font-bold text-ml-dark-blue leading-tight">Minha Loja de Ofertas</h1>
        <p class="text-sm font-medium text-ml-dark-blue opacity-80">Os melhores achadinhos do Mercado Livre</p>
    </header>

    <!-- 2. Barra de Busca -->
    <section class="max-w-4xl mx-auto w-full px-4 -mt-6">
        <div class="flex bg-white rounded-full shadow-lg p-1 border border-gray-100">
            <div class="flex items-center px-4 text-gray-400">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
            </div>
            <input type="text" id="searchInput" placeholder="O que você procura hoje?"
                class="w-full p-3 outline-none text-sm bg-transparent">
            <button onclick="executeSearch()" class="bg-ml-blue text-white px-6 py-2 rounded-full text-sm font-semibold hover:bg-blue-600 transition">
                Buscar
            </button>
        </div>
    </section>

    <!-- 3. Categorias Pílulas -->
    <section class="max-w-4xl mx-auto w-full px-4 mt-6">
        <div id="categoryFilters" class="flex gap-3 overflow-x-auto pb-4 no-scrollbar">
            <!-- Injetado via JS -->
        </div>
    </section>

    <!-- 4. Banner de Destaque -->
    <section class="max-w-4xl mx-auto w-full px-4 mt-4">
        <div class="bg-ml-dark-blue rounded-3xl p-6 text-white relative overflow-hidden shadow-xl">
            <!-- Detalhes decorativos -->
            <div class="absolute top-[-20px] right-[-20px] w-32 h-32 bg-ml-yellow rounded-full opacity-20"></div>
            <div class="absolute bottom-[-10px] left-[-10px] w-20 h-20 bg-ml-yellow rounded-full opacity-10"></div>

            <div class="relative z-10 flex items-center gap-3 mb-2">
                <span class="bg-ml-yellow text-ml-dark-blue font-bold px-2 py-1 rounded-lg text-xs"> % </span>
                <h2 class="text-2xl font-bold">Ofertas <span class="text-ml-yellow">Imperdíveis!</span></h2>
            </div>
            <p class="text-sm opacity-90 font-light">Tudo o que você precisa, em um só lugar! ✨</p>
        </div>
    </section>

    <!-- 5. Categorias em Destaque -->
    <section class="max-w-4xl mx-auto w-full px-4 mt-10">
        <div class="flex items-center gap-2 mb-6">
            <div class="w-1 h-6 bg-ml-yellow rounded-full"></div>
            <h2 class="text-xl font-bold text-ml-dark-blue">Categorias em Destaque</h2>
        </div>
        <div id="featuredCategories" class="grid grid-cols-2 sm:grid-cols-3 gap-4">
            <!-- Injetado via JS -->
        </div>
    </section>

    <!-- 6. Grade de Produtos -->
    <section class="max-w-4xl mx-auto w-full px-4 mt-12 mb-12">
        <div class="flex items-center gap-2 mb-6">
            <div class="w-1 h-6 bg-ml-yellow rounded-full"></div>
            <h2 class="text-xl font-bold text-ml-dark-blue">Todos os Produtos</h2>
        </div>
        <div id="productGrid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4">
            <!-- Injetado via JS -->
        </div>
    </section>

    <!-- 7. Rodapé -->
    <footer class="bg-white border-t py-8 px-4 text-center space-y-3">
        <p class="text-sm text-gray-600 font-medium">Você finaliza a compra no site do Mercado Livre</p>
        <p class="text-xs text-gray-400 italic">Links de afiliado: posso receber comissão pelas compras.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
