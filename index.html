<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Vitrine de Ofertas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .product-card:hover { transform: translateY(-5px); transition: all 0.3s ease; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-yellow-400 py-6 px-4 shadow-md sticky top-0 z-10">
        <div class="max-w-4xl mx-auto text-center">
            <h1 class="text-2xl font-bold text-gray-900">🛍️ Minha Loja de Ofertas</h1>
            <p class="text-sm text-gray-700">Os melhores achadinhos do Mercado Livre</p>
        </div>
    </header>

    <!-- Filtros e Busca -->
    <section class="max-w-4xl mx-auto w-full p-4">
        <div class="flex flex-col gap-4">
            <!-- Busca -->
            <input type="text" id="searchInput" placeholder="🔎 Buscar produto..."
                class="w-full p-3 rounded-xl border border-gray-300 shadow-sm focus:ring-2 focus:ring-yellow-400 outline-none">

            <!-- Categorias -->
            <div id="categoryFilters" class="flex gap-2 overflow-x-auto pb-2 no-scrollbar">
                <button onclick="filterCategory('Todos')" class="cat-btn bg-yellow-400 px-4 py-2 rounded-full text-sm font-medium shadow-sm whitespace-nowrap">Todos</button>
            </div>
        </div>
    </section>

    <!-- Grid de Produtos -->
    <main class="max-w-4xl mx-auto w-full p-4 flex-grow">
        <div id="productGrid" class="grid grid-cols-2 md:grid-cols-3 gap-4">
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t py-6 px-4 text-center text-xs text-gray-500">
        <p>Links de afiliado. Posso receber comissão pelas compras.</p>
        <p class="mt-2">&copy; 2024 Minha Vitrine de Ofertas</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
