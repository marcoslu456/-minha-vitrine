<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Loja de Ofertas | Achadinhos ML</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'ml-yellow': '#FFE600',
                        'ml-dark-blue': '#2D3277',
                        'ml-blue': '#3483FA',
                        'ml-bg': '#F5F6FA',
                    },
                    fontFamily: { poppins: ['Poppins', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Poppins', sans-serif; }
        .curved-header { border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .product-card { transition: all 0.3s ease; }
        .product-card:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
    </style>
</head>
<body class="bg-ml-bg text-gray-800 min-h-screen flex flex-col">

    <!-- 1. Cabeçalho Compacto -->
    <header class="bg-ml-yellow py-4 px-4 curved-header shadow-sm text-center">
        <h1 class="text-xl font-bold text-ml-dark-blue leading-tight">Minha Loja de Ofertas</h1>
        <p class="text-xs font-medium text-ml-dark-blue opacity-80">Achadinhos do Mercado Livre</p>
    </header>

    <!-- 2. Barra de Busca Compacta -->
    <section class="max-w-4xl mx-auto w-full px-4 -mt-4">
        <div class="flex bg-white rounded-full shadow-md p-1 border border-gray-100">
            <div class="flex items-center px-3 text-gray-400">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
            </div>
            <input type="text" id="searchInput" placeholder="Buscar produto..." class="w-full p-2 outline-none text-sm bg-transparent">
            <button onclick="executeSearch()" class="bg-ml-blue text-white px-4 py-1.5 rounded-full text-xs font-semibold hover:bg-blue-600 transition">
                Buscar
            </button>
        </div>
    </section>

    <!-- REMOVIDA A SEÇÃO DE CATEGORIAS EM TEXTO AQUI -->

    <!-- 3. Banner Minimalista -->
    <section class="max-w-4xl mx-auto w-full px-4 mt-4">
        <div class="bg-ml-dark-blue rounded-2xl p-4 text-white relative overflow-hidden shadow-md">
            <div class="relative z-10 flex items-center gap-2">
                <span class="bg-ml-yellow text-ml-dark-blue font-bold px-1.5 py-0.5 rounded text-[10px]"> % </span>
                <h2 class="text-lg font-bold leading-tight">Ofertas <span class="text-ml-yellow">Imperdíveis!</span></h2>
            </div>
            <p class="text-xs opacity-90 font-light">Tudo o que você precisa aqui! ✨</p>
        </div>
    </section>

    <!-- 4. Categorias Visuais (Agora são a única guia) -->
    <section class="max-w-4xl mx-auto w-full px-4 mt-6">
        <div class="flex items-center gap-2 mb-3">
            <div class="w-1 h-4 bg-ml-yellow rounded-full"></div>
            <h2 class="text-sm font-bold text-ml-dark-blue">Destaques</h2>
        </div>
        <div id="featuredCategories" class="flex gap-3 overflow-x-auto pb-2 no-scrollbar">
            <!-- Injetado via JS -->
        </div>
    </section>

    <!-- 5. Grade de Produtos -->
    <section class="max-w-4xl mx-auto w-full px-4 mt-6 mb-12">
        <div class="flex items-center gap-2 mb-4">
            <div class="w-1 h-4 bg-ml-yellow rounded-full"></div>
            <h2 class="text-sm font-bold text-ml-dark-blue">Produtos</h2>
        </div>
        <div id="productGrid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3">
            <!-- Injetado via JS -->
        </div>
    </section>

    <!-- 6. Rodapé -->
    <footer class="bg-white border-t py-6 px-4 text-center space-y-2">
        <p class="text-xs text-gray-600 font-medium">Você finaliza a compra no site do Mercado Livre</p>
        <p class="text-[10px] text-gray-400 italic">Links de afiliado: posso receber comissão pelas compras.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
